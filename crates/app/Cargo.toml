[package]
name = "infinite_canvas"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
canvas_core = { version = "0.1.0", path = "../core" }
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
log = "0.4.35"
pollster = "1.0.3"
wgpu = "30"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_os = "android"))'.dependencies]
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
winit = "0.30"
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
ndk = { version = "0.9", features = ["rwh_06"] }
raw-window-handle = "0.6"

